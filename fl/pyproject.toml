[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devign-federated"
version = "0.1.0"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = { file = "../LICENSE" }
dependencies = [
    "flwr",
    "numpy",
    "scikit-learn",
    "torch",
    "torch-geometric",
    "tree-sitter",
    "tree-sitter-c",
    "ray",
]

[tool.flwr.app]
publisher = "devign"
fab-include = ["pyproject.toml", "fl_client.py", "fl_server.py", "src/"]

[tool.flwr.app.components]
serverapp = "fl_server:app"
clientapp = "fl_client:app"

[tool.flwr.app.config]
data-dir = "data/federated/iid/server"
vocabulary = "data/federated/iid/vocabulary.json"
rounds = 30
min-clients = 2
local-epochs = 1
batch-size = 32
learning-rate = 0.001
weight-decay = 0.0001
proximal-mu = 0.001
embedding-dim = 128
hidden-dim = 128
dropout = 0.3
max-tokens = 512
context-window = 4
structural-edges = true
ast-edges = false
data-flow-edges = false
class-weights = true
threshold-metric = "macro-f1"
min-client-score = 0.5
min-clients-to-aggregate = 2
seed = 42
training-job-id = ""
initial-model-hash = ""
api-endpoint = ""

[tool.hatch.build.targets.wheel]
packages = ["src"]

[superlink]
default = "local"
